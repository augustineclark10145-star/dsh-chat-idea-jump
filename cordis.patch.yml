# dsh-chat-idea-jump bundle patch
#
# `dsh.bundle.patch` layer of the published package: installing through the
# official CLI —
#
#   dsh plugin --profile <name> add dsh-chat-idea-jump
#
# — appends this single `insert` (one plugin row) to the bundle stack.
# No manual profile edits.
#
# Behaviour: clicking a file reference in DSH chat opens a chooser offering the
# right sidebar (with line number) or any detected desktop editor.
# Config: ideaPath left empty auto-detects the JetBrains install; editors adds
# extra editors as `Label=path/to/exe`.
- insert:
    - id: 'dsh-chat-idea-jump'
      name: 'dsh-chat-idea-jump'
      config:
        ideaPath: ''
        editors: []
